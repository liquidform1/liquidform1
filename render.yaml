# Render Blueprint - New + > Blueprint, point it at this repo.
services:
  - type: web
    name: liquidform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional: only needed for the Liquidform AI page.
      - key: OPENROUTER_API_KEY
        sync: false
