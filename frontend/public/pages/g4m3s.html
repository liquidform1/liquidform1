<!DOCTYPE html>
<html lang="en">
<head>
<script src="../guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquidform - G4m3s</title>
  <link rel="icon" href="../images/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #141417; --bg-gradient-end: #09090b;
      --panel-bg: rgba(24, 24, 27, 0.6); --text: #fafafa; --text-soft: #a1a1aa; --accent: #a5b4fc;
      --border-light: rgba(255, 255, 255, 0.06); --border-hover: rgba(255, 255, 255, 0.15);
      --shadow-soft: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: var(--text); overflow-x: hidden; }
    .main-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1100px; padding: 60px 20px; z-index: 10; }
    .title-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 2rem; gap: 6px; }
    .title { font-size: 3.2rem; font-weight: 700; letter-spacing: -0.02em; text-shadow: 0 4px 20px rgba(0,0,0,.3); }
    .subtitle { font-size: 1.05rem; color: var(--text-soft); text-align: center; }
    .search-card { width: 100%; max-width: 540px; margin-bottom: 1.2rem; border-radius: 40px; background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-light); box-shadow: var(--shadow-soft); }
    .search-box { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 24px; }
    .search-box input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 1.1rem; padding: 6px 0; }
    .toolbar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 1.4rem; color: var(--text-soft); font-size: .9rem; }
    .pill-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 14px; font-size: .85rem; font-weight: 600; cursor: pointer; color: var(--text); background: var(--panel-bg); border: 1px solid var(--border-light); }
    .grid { width: 100%; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .game { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 10px 14px; border-radius: 22px; cursor: pointer; text-align: center; background: var(--panel-bg); border: 1px solid var(--border-light); transition: transform .2s ease, border-color .2s ease; }
    .game:hover { transform: translateY(-4px); border-color: var(--border-hover); }
    .game .cover { width: 100%; aspect-ratio: 1; border-radius: 16px; object-fit: cover; background: #0b0b18; display: block; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
    .game .name { font-size: .85rem; font-weight: 500; line-height: 1.25; width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .empty { width: 100%; max-width: 520px; text-align: center; padding: 36px 28px; border-radius: 28px; background: var(--panel-bg); border: 1px solid var(--border-light); color: var(--text-soft); line-height: 1.6; }
    .empty i { font-size: 2rem; color: var(--accent); margin-bottom: 14px; display: block; }
    .empty .pill-btn { margin-top: 16px; }
    .more { margin: 24px 0 8px; }
    .player-overlay { position: fixed; inset: 0; z-index: 3000; display: none; flex-direction: column; background: rgba(8,8,12,.96); }
    .player-overlay.open { display: flex; }
    .player-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border-light); }
    .player-title { flex: 1; font-weight: 600; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--panel-bg); border: 1px solid var(--border-light); color: var(--text); cursor: pointer; }
    .player-loading { position: absolute; top: 64px; left: 0; right: 0; text-align: center; color: var(--text-soft); font-size: .9rem; pointer-events: none; display: none; }
    .player-loading.show { display: block; }
    .player-frame { flex: 1; width: 100%; border: none; background: #000; }
  </style>
  <link rel="stylesheet" href="../liquid-glass.css">
</head>
<body>
  <div class="main-container">
    <div class="title-section">
      <h1 class="title">G4m3s</h1>
      <div class="subtitle">Pick a g4me and play — everything runs right here, no pr0xy needed</div>
    </div>
    <div class="search-card">
      <form class="search-box" id="searchForm" autocomplete="off" onsubmit="event.preventDefault();">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search g4m3s..." data-testid="games-search">
      </form>
    </div>
    <div class="toolbar">
      <span id="count" data-testid="games-count"></span>
      <button class="pill-btn" id="randomBtn" data-testid="games-random"><i class="fa-solid fa-shuffle"></i> Random</button>
    </div>
    <div class="grid" id="grid" data-testid="games-grid"></div>
    <div id="status"></div>
    <button class="pill-btn more" id="moreBtn" style="display:none">Show more</button>
  </div>

  <div class="player-overlay" id="player" data-testid="games-player">
    <div class="player-bar">
      <button class="icon-btn" id="closeBtn" title="Close" data-testid="games-close"><i class="fa-solid fa-xmark"></i></button>
      <div class="player-title" id="playerTitle"></div>
      <button class="icon-btn" id="reloadBtn" title="Restart"><i class="fa-solid fa-rotate-right"></i></button>
      <button class="icon-btn" id="newTabBtn" title="Open in new tab"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
      <button class="icon-btn" id="fsBtn" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
    </div>
    <div class="player-loading" id="playerLoading"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading g4me… the first time can take a little while</div>
    <iframe class="player-frame" id="playerFrame" allow="fullscreen; autoplay; gamepad; clipboard-write"
            sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-modals allow-popups allow-downloads"></iframe>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const PAGE = 120;
    let all = [], shown = 0, filtered = [], pollTries = 0, current = null;

    function card(g) {
      const el = document.createElement('div');
      el.className = 'game'; el.dataset.testid = 'game-card';
      el.innerHTML = '<img class="cover" loading="lazy" alt=""><div class="name"></div>';
      const img = el.querySelector('.cover');
      img.onerror = () => { img.onerror = null; img.src = '/images/logo.png'; };
      img.src = g.cover || '/images/logo.png';
      el.querySelector('.name').textContent = g.name;
      el.title = g.name;
      el.onclick = () => play(g);
      return el;
    }
    function render(reset) {
      const grid = $('#grid');
      if (reset) { grid.innerHTML = ''; shown = 0; }
      const next = filtered.slice(shown, shown + PAGE);
      next.forEach(g => grid.appendChild(card(g)));
      shown += next.length;
      $('#moreBtn').style.display = shown < filtered.length ? '' : 'none';
      $('#count').textContent = filtered.length === all.length ? `${all.length} g4m3s` : `${filtered.length} of ${all.length} g4m3s`;
    }
    function applyFilter() {
      const q = $('#searchInput').value.trim().toLowerCase();
      filtered = q ? all.filter(g => g.name.toLowerCase().includes(q)) : all;
      $('#status').innerHTML = '';
      if (all.length && !filtered.length) $('#status').innerHTML = '<div class="empty"><i class="fa-regular fa-face-frown"></i>No g4m3s match that search.</div>';
      render(true);
    }
    function showEmpty(msg) {
      $('#status').innerHTML = '<div class="empty"><i class="fa-solid fa-gamepad"></i>' + msg +
        '<br><button class="pill-btn" id="retryBtn"><i class="fa-solid fa-rotate-right"></i> Try again</button></div>';
      $('#retryBtn').onclick = () => { pollTries = 0; load(); };
    }
    async function load() {
      $('#status').innerHTML = '';
      try { const r = await fetch('/api/g4m3s', { cache: 'no-store' }); all = (await r.json()).games || []; } catch (e) { all = []; }
      if (!all.length) {
        $('#count').textContent = '';
        showEmpty('The g4m3s list failed to load. Check your connection and try again.');
        return;
      }
      applyFilter();
    }
    function play(g) { current = g; $('#playerTitle').textContent = g.name; $('#playerLoading').classList.add('show'); $('#playerFrame').src = g.url; $('#player').classList.add('open'); }
    function closePlayer() { $('#playerLoading').classList.remove('show'); $('#player').classList.remove('open'); $('#playerFrame').src = 'about:blank'; if (document.fullscreenElement) document.exitFullscreen(); }
    $('#closeBtn').onclick = closePlayer;
    $('#playerFrame').addEventListener('load', () => { if ($('#playerFrame').src !== 'about:blank' && !$('#playerFrame').src.endsWith('about:blank')) $('#playerLoading').classList.remove('show'); });
    $('#reloadBtn').onclick = () => { if (current) { $('#playerLoading').classList.add('show'); $('#playerFrame').src = current.url; } };
    $('#newTabBtn').onclick = () => { if (current) window.open(current.url, '_blank'); };
    $('#fsBtn').onclick = () => { const f = $('#playerFrame'); if (document.fullscreenElement) document.exitFullscreen(); else (f.requestFullscreen || f.webkitRequestFullscreen)?.call(f); };
    $('#randomBtn').onclick = () => { if (all.length) play(all[Math.floor(Math.random() * all.length)]); };
    $('#moreBtn').onclick = () => render(false);
    $('#searchInput').addEventListener('input', applyFilter);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#player').classList.contains('open')) closePlayer(); });
    load();
  </script>
</body>
</html>
